[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "E701", "E702", "E731", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::starlette.exceptions.StarletteDeprecationWarning"]
