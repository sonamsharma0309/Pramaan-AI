name: CD

# Publishes the Docker image to GitHub Container Registry (ghcr.io)
# after CI has passed on a push to main. No extra secrets are needed:
# it uses the built-in GITHUB_TOKEN.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only publish when CI succeeded for a push to main (never for pull requests),
    # or when started by hand from the Actions tab.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image name and tags
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.title=Pramaan AI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}:sha-${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
