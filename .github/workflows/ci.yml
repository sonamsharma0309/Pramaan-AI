name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  frontend:
    name: Frontend syntax (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that every JavaScript module parses
        run: |
          fail=0
          for f in frontend/js/*.js frontend/js/portal/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            if ! node --check "$RUNNER_TEMP/check.mjs"; then
              echo "::error file=$f::JavaScript syntax error"
              fail=1
            fi
          done
          exit $fail

  test:
    name: Tests, migrations and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install OCR system packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Migrations apply cleanly
        run: DATA_DIR=$(mktemp -d) python -m alembic upgrade head
      - name: Smoke test (app boots, health and frontend respond)
        run: |
          export DATA_DIR="$(mktemp -d)"
          python -m alembic upgrade head
          python -m uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fs http://127.0.0.1:8000/ | grep -qi "<html"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, frontend, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pramaan-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
