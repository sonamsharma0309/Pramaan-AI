# Usage:  cp .env.example .env  ->  paste keys  ->  docker compose up --build
# Optional nginx reverse proxy on port 80:  docker compose --profile proxy up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pramaan}
      POSTGRES_USER: ${POSTGRES_USER:-pramaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pramaan} -d ${POSTGRES_DB:-pramaan}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pramaan}:${POSTGRES_PASSWORD:-change-me-please}@db:5432/${POSTGRES_DB:-pramaan}
      DATA_DIR: /app/data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  appdata:
